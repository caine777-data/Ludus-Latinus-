name: Build & Release Ludus Latinus

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez 'oui' pour confirmer la génération et la publication :"
        required: true
        default: ""
      version_action:
        description: "Action sur le numéro de version :"
        type: choice
        options:
          - "patch (+0.0.1  ex: 1.0.0 -> 1.0.1)"
          - "minor (+0.1.0  ex: 1.0.0 -> 1.1.0)"
          - "major (+1.0.0  ex: 1.0.0 -> 2.0.0)"
          - "personnalisée"
          - "conserver (version actuelle)"
        default: "patch (+0.0.1  ex: 1.0.0 -> 1.0.1)"
      custom_version:
        description: "Si 'personnalisée', entrez la version exacte (ex: 1.0.1) :"
        required: false
        default: ""
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  prepare:
    name: Préparation & Versioning
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.export_version.outputs.version }}
      is_release: ${{ steps.export_version.outputs.is_release }}
      ref: ${{ steps.export_version.outputs.ref }}
    steps:
      - name: Vérifier la confirmation 'oui'
        if: github.event_name == 'workflow_dispatch'
        run: |
          REPONSE=$(echo "${{ github.event.inputs.confirmation }}" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$REPONSE" != "oui" ]; then
            echo "::error::Action annulée ! Vous devez taper 'oui' dans le champ de confirmation pour lancer la publication."
            exit 1
          fi
          echo "Confirmation 'oui' validée avec succès !"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Tkinter & Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer dépendances et valider tests
        run: |
          python -m pip install --upgrade pip pillow
          python main.py --check
          xvfb-run -a python -m unittest discover -s tests -v

      - name: Gestion du numéro de version
        id: versioning
        run: |
          ACTION="${{ github.event.inputs.version_action || 'conserver' }}"
          CUSTOM="${{ github.event.inputs.custom_version || '' }}"
          python packaging/bump_version.py "$ACTION" "$CUSTOM"

      - name: Committer et tagger la nouvelle version
        id: git_push
        if: env.VERSION_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/version.py pyproject.toml packaging/installer.iss
          git commit -m "chore(release): version v${{ env.NEW_VERSION }}"
          git tag -a "v${{ env.NEW_VERSION }}" -m "Ludus Latinus v${{ env.NEW_VERSION }}"
          git push origin HEAD:${{ github.ref_name }} --tags
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Exporter les sorties de version
        id: export_version
        run: |
          VERSION="${{ env.NEW_VERSION }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(python -c "from app.version import __version__; print(__version__)")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          IS_REL="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_REL="true"
          fi
          echo "is_release=$IS_REL" >> $GITHUB_OUTPUT

          REF="${{ steps.git_push.outputs.commit_sha }}"
          if [ -z "$REF" ]; then
            REF="${{ github.ref }}"
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Préparation terminée : Version=$VERSION, IsRelease=$IS_REL, Ref=$REF"

  build-windows:
    name: Build Windows (Setup.exe & Portable)
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm LudusLatinus.spec

      - name: Installer Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Compiler le Setup Windows avec Inno Setup
        shell: pwsh
        run: |
          $iscc = "iscc"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Compilateur Inno Setup utilisé : $iscc"
          & $iscc /DMaVersion="${{ needs.prepare.outputs.version }}" packaging/installer.iss
          Get-ChildItem -Path Output

      - name: Préparer les binaires Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows
          Copy-Item dist\LudusLatinus.exe release-windows\
          Copy-Item Output\*.exe release-windows\
          Get-ChildItem release-windows

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Windows
          path: release-windows/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (.dmg Apple Silicon)
    runs-on: macos-latest
    needs: prepare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm LudusLatinus.spec

      - name: Construire le disque .dmg
        run: |
          bash packaging/macos/construire-dmg.sh "${{ needs.prepare.outputs.version }}" arm64

      - name: Préparer les binaires macOS
        run: |
          mkdir -p release-macos
          cp dist/*.dmg release-macos/
          ls -lh release-macos/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-macOS
          path: release-macos/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (.deb & .tar.gz)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Installer Tkinter système
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Linux Executable with PyInstaller
        run: |
          pyinstaller --noconfirm LudusLatinus.spec

      - name: Construire les paquets Linux (.deb & .tar.gz)
        run: |
          bash packaging/linux/construire-paquets.sh "${{ needs.prepare.outputs.version }}"

      - name: Préparer les binaires Linux
        run: |
          mkdir -p release-linux
          cp dist/*.deb dist/*.tar.gz release-linux/
          ls -lh release-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Linux
          path: release-linux/*
          if-no-files-found: error

  publish-release:
    name: Publier la Release Multi-Plateforme
    runs-on: ubuntu-latest
    needs: [prepare, build-windows, build-macos, build-linux]
    if: needs.prepare.outputs.is_release == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Télécharger tous les binaires
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Vérifier les binaires téléchargés
        run: |
          echo "=== Fichiers prêts pour publication ==="
          ls -lh release-assets/

      - name: Publier ou Mettre à jour la Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          NOTES=$(cat <<EOF
          🏛️ **Ludus Latinus $TAG — L'Aventure Romaine** est disponible sur toutes les plateformes !

          ### 📦 Téléchargements disponibles :

          #### 🪟 Windows (10 / 11)
          - **[Installateur recommandé]** \`LudusLatinus-Setup-${VERSION}.exe\` : installe l'application avec raccourcis Bureau et Menu Démarrer.
          - **[Version portable]** \`LudusLatinus.exe\` : à lancer directement sans installation préalable.

          #### 🍎 macOS (Apple Silicon M1 / M2 / M3 / M4)
          - **[Image disque]** \`LudusLatinus-${VERSION}-arm64.dmg\` : ouvrez le DMG et glissez Ludus Latinus dans votre dossier Applications.
          > *Note macOS* : Au premier lancement, faites un **clic droit -> Ouvrir** sur l'application pour autoriser son ouverture (signature ad-hoc).

          #### 🐧 Linux (Debian, Ubuntu, Mint & toutes distributions)
          - **[Paquet Debian / Ubuntu]** \`ludus-latinus_${VERSION}_amd64.deb\` : installation système via \`sudo dpkg -i ludus-latinus_${VERSION}_amd64.deb\`.
          - **[Archive autonome]** \`ludus-latinus-${VERSION}-linux-amd64.tar.gz\` : décompressez et lancez \`bash installer.sh\` (aucun droit root nécessaire).

          ---
          *Progression et cartes automatiquement sauvegardées dans le profil utilisateur.*
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà : téléversement des binaires..."
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "Ludus Latinus $TAG" --notes "$NOTES"
          else
            echo "Création de la nouvelle release $TAG..."
            gh release create "$TAG" release-assets/* \
              --title "Ludus Latinus $TAG" \
              --notes "$NOTES" \
              --latest
          fi
