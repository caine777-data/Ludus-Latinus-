name: Build & Release Ludus Latinus

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez 'oui' pour confirmer la génération et la publication :"
        required: true
        default: ""
      version_action:
        description: "Action sur le numéro de version :"
        type: choice
        options:
          - "patch (+0.0.1  ex: 1.0.0 -> 1.0.1)"
          - "minor (+0.1.0  ex: 1.0.0 -> 1.1.0)"
          - "major (+1.0.0  ex: 1.0.0 -> 2.0.0)"
          - "personnalisée"
          - "conserver (version actuelle)"
        default: "patch (+0.0.1  ex: 1.0.0 -> 1.0.1)"
      custom_version:
        description: "Si 'personnalisée', entrez la version exacte (ex: 1.0.1) :"
        required: false
        default: ""
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Executable & Release
    runs-on: windows-latest

    steps:
      - name: Vérifier la confirmation 'oui'
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          REPONSE=$(echo "${{ github.event.inputs.confirmation }}" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$REPONSE" != "oui" ]; then
            echo "::error::Action annulée ! Vous devez taper 'oui' dans le champ de confirmation pour lancer la publication."
            exit 1
          fi
          echo "Confirmation 'oui' validée avec succès !"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gestion du numéro de version
        shell: bash
        run: |
          ACTION="${{ github.event.inputs.version_action || 'conserver' }}"
          CUSTOM="${{ github.event.inputs.custom_version || '' }}"
          python packaging/bump_version.py "$ACTION" "$CUSTOM"

      - name: Committer et tagger la nouvelle version
        if: env.VERSION_CHANGED == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/version.py pyproject.toml packaging/installer.iss
          git commit -m "chore(release): version v${{ env.NEW_VERSION }}"
          git tag -a "v${{ env.NEW_VERSION }}" -m "Ludus Latinus v${{ env.NEW_VERSION }}"
          git push origin HEAD:${{ github.ref_name }} --tags

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Verify Curriculum and Tests
        shell: bash
        run: |
          python main.py --check
          python -m unittest discover -s tests -t .

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm LudusLatinus.spec

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Windows
          path: dist/LudusLatinus.exe
          if-no-files-found: error

      - name: Publier la Release GitHub
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ env.NEW_VERSION }}"
          if [ -z "${{ env.NEW_VERSION }}" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "Création de la release $TAG sur GitHub..."
          gh release create "$TAG" "dist/LudusLatinus.exe#LudusLatinus.exe" \
            --title "Ludus Latinus $TAG" \
            --notes "🚀 **Ludus Latinus $TAG** est disponible ! Téléchargez le fichier **LudusLatinus.exe** ci-dessous pour jouer directement sous Windows." \
            --latest
