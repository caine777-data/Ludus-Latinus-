name: Build Mobile & Multiplateforme (Flutter Android & Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ludus_latinus_mobile/**'
      - '.github/workflows/build_mobile.yml'
      - 'assets/data/ludus_latinus_dataset.json'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (APK & Google Play Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Installer les dépendances Flutter
        working-directory: ./ludus_latinus_mobile
        run: flutter pub get

      - name: Analyse statique Dart (Android)
        working-directory: ./ludus_latinus_mobile
        run: |
          set -o pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log

      - name: Rapport d'erreur d'analyse en cas d'échec
        if: failure()
        working-directory: ./ludus_latinus_mobile
        run: |
          echo "## ❌ Erreur Analyse Statique Dart Android" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat analyze.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publier les logs d'analyse Android
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Analyze-Log
          path: ludus_latinus_mobile/analyze.log
          if-no-files-found: ignore

      - name: Compiler Android App Bundle (.aab Google Play Store)
        working-directory: ./ludus_latinus_mobile
        run: |
          set -o pipefail
          flutter build appbundle --release --android-skip-build-dependency-validation 2>&1 | tee android_build.log

      - name: Rapport d'erreur Android en cas d'échec
        if: failure()
        working-directory: ./ludus_latinus_mobile
        run: |
          echo "## ❌ Erreur Compilation Android" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 android_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publier les logs d'erreur Android
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Error-Log
          path: ludus_latinus_mobile/android_build.log
          if-no-files-found: ignore

      - name: Sauvegarder les logs Android sur la branche debug
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B ci-debug-logs
          mkdir -p ./logs
          [ -f ludus_latinus_mobile/analyze.log ] && cp ludus_latinus_mobile/analyze.log ./logs/analyze_android.log
          [ -f ludus_latinus_mobile/android_build.log ] && cp ludus_latinus_mobile/android_build.log ./logs/android_build.log
          git add -f ./logs/
          git commit -m "ci: logs android [skip ci]" || true
          git push origin ci-debug-logs --force

      - name: Compiler APK Android (Installation directe)
        working-directory: ./ludus_latinus_mobile
        run: flutter build apk --split-per-abi --release --android-skip-build-dependency-validation

      - name: Publier les fichiers Android en Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Android-Builds
          path: |
            ludus_latinus_mobile/build/app/outputs/bundle/release/*.aab
            ludus_latinus_mobile/build/app/outputs/flutter-apk/*.apk
            ludus_latinus_mobile/android/build/app/outputs/bundle/release/*.aab
            ludus_latinus_mobile/android/build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Build Windows Desktop (.exe natif)
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Diagnostic Flutter & Visual Studio
        run: flutter doctor -v

      - name: Configurer plateforme Windows Desktop
        working-directory: ./ludus_latinus_mobile
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --org com.luduslatinus
          git checkout test/ || true
          flutter pub get

      - name: Analyse statique Dart (Windows)
        working-directory: ./ludus_latinus_mobile
        shell: pwsh
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | Tee-Object -FilePath analyze.log

      - name: Rapport d'erreur d'analyse Windows en cas d'échec
        if: failure()
        working-directory: ./ludus_latinus_mobile
        shell: pwsh
        run: |
          "## ❌ Erreur Analyse Statique Dart Windows" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          '```text' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if (Test-Path analyze.log) {
            Get-Content analyze.log | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Publier les logs d'analyse Windows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Analyze-Log
          path: ludus_latinus_mobile/analyze.log
          if-no-files-found: ignore

      - name: Compiler Windows .exe natif
        working-directory: ./ludus_latinus_mobile
        shell: pwsh
        run: |
          flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath windows_build.log

      - name: Rapport d'erreur Windows en cas d'échec
        if: failure()
        working-directory: ./ludus_latinus_mobile
        shell: pwsh
        run: |
          "## ❌ Erreur Compilation Windows" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          '```text' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if (Test-Path windows_build.log) {
            Get-Content windows_build.log -Tail 120 | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Publier les logs d'erreur Windows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Error-Log
          path: ludus_latinus_mobile/windows_build.log
          if-no-files-found: ignore

      - name: Sauvegarder les logs Windows sur la branche debug
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B ci-debug-logs
          New-Item -ItemType Directory -Force -Path "./logs"
          if (Test-Path ludus_latinus_mobile/analyze.log) { Copy-Item ludus_latinus_mobile/analyze.log ./logs/analyze_windows.log }
          if (Test-Path ludus_latinus_mobile/windows_build.log) { Copy-Item ludus_latinus_mobile/windows_build.log ./logs/windows_build.log }
          git add -f ./logs/
          git commit -m "ci: logs windows [skip ci]"
          git push origin ci-debug-logs --force

      - name: Compresser le dossier Windows Release
        working-directory: ./ludus_latinus_mobile
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path "build/windows" -Recurse -Filter "ludus_latinus_mobile.exe" | Select-Object -First 1
          if (-not $exeFile) {
            # Fallback : chercher le dossier runner/Release
            $releaseFolder = Get-ChildItem -Path "build/windows" -Recurse -Directory | Where-Object { $_.FullName -like "*runner*Release*" } | Select-Object -First 1
            if ($releaseFolder) {
              $releaseDir = $releaseFolder
            } else {
              Write-Error "Fichier ludus_latinus_mobile.exe introuvable sous build/windows"
              exit 1
            }
          } else {
            $releaseDir = $exeFile.Directory
          }
          Write-Host "Dossier Windows Release trouve : $($releaseDir.FullName)"
          Get-ChildItem -Path $releaseDir.FullName | ForEach-Object { Write-Host "  - $($_.Name)" }
          Compress-Archive -Path "$($releaseDir.FullName)/*" -DestinationPath "../LudusLatinus-Windows-Flutter.zip" -Force

      - name: Publier l'archive Windows en Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Windows-Flutter
          path: LudusLatinus-Windows-Flutter.zip