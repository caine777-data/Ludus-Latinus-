name: Build Mobile & Multiplateforme (Flutter Android & Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ludus_latinus_mobile/**'
      - '.github/workflows/build_mobile.yml'
      - 'assets/data/ludus_latinus_dataset.json'

jobs:
  build-android:
    name: Build Android (APK & Google Play Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Installer les dépendances (flutter pub get)
        working-directory: ./ludus_latinus_mobile
        run: flutter pub get

      - name: Compiler Android App Bundle (.aab Google Play Store)
        working-directory: ./ludus_latinus_mobile
        run: flutter build appbundle --release

      - name: Compiler APK Android (Installation directe)
        working-directory: ./ludus_latinus_mobile
        run: flutter build apk --split-per-abi --release

      - name: Publier les fichiers Android en Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Android-Builds
          path: |
            ludus_latinus_mobile/build/app/outputs/bundle/release/*.aab
            ludus_latinus_mobile/build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Build Windows Desktop (.exe natif)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Activer Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Installer les dépendances (flutter pub get)
        working-directory: ./ludus_latinus_mobile
        run: flutter pub get

      - name: Compiler Windows .exe natif
        working-directory: ./ludus_latinus_mobile
        run: flutter build windows --release

      - name: Compresser le dossier Windows Release
        working-directory: ./ludus_latinus_mobile/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath ../../../../../LudusLatinus-Windows-Flutter.zip

      - name: Publier l'archive Windows en Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Windows-Flutter
          path: LudusLatinus-Windows-Flutter.zip