name: Build Mobile & Multiplateforme (Flutter Android & Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ludus_latinus_mobile/**'
      - '.github/workflows/build_mobile.yml'
      - 'assets/data/ludus_latinus_dataset.json'

jobs:
  build-android:
    name: Build Android (APK & Google Play Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Installer les dépendances Flutter
        working-directory: ./ludus_latinus_mobile
        run: flutter pub get

      - name: Compiler Android App Bundle (.aab Google Play Store)
        working-directory: ./ludus_latinus_mobile
        run: |
          set -o pipefail
          flutter build appbundle --release --android-skip-build-dependency-validation 2>&1 | tee android_build.log

      - name: Rapport d'erreur Android en cas d'échec
        if: failure()
        working-directory: ./ludus_latinus_mobile
        run: |
          echo "## ❌ Erreur Compilation Android" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 android_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Compiler APK Android (Installation directe)
        working-directory: ./ludus_latinus_mobile
        run: flutter build apk --split-per-abi --release --android-skip-build-dependency-validation

      - name: Publier les fichiers Android en Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Android-Builds
          path: |
            ludus_latinus_mobile/build/app/outputs/bundle/release/*.aab
            ludus_latinus_mobile/build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Build Windows Desktop (.exe natif)
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Diagnostic Flutter & Visual Studio
        run: flutter doctor -v

      - name: Configurer plateforme Windows Desktop
        working-directory: ./ludus_latinus_mobile
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --org com.luduslatinus
          flutter pub get

      - name: Compiler Windows .exe natif
        working-directory: ./ludus_latinus_mobile
        shell: pwsh
        run: |
          flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath windows_build.log

      - name: Rapport d'erreur Windows en cas d'échec
        if: failure()
        working-directory: ./ludus_latinus_mobile
        shell: pwsh
        run: |
          "## ❌ Erreur Compilation Windows" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          '```text' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if (Test-Path windows_build.log) {
            Get-Content windows_build.log -Tail 80 | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          '```' | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Compresser le dossier Windows Release
        working-directory: ./ludus_latinus_mobile
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path "build/windows" -Recurse -Directory -Filter "Release" | Select-Object -First 1
          if (-not $releaseDir) {
            Write-Error "Dossier Release introuvable sous build/windows"
            exit 1
          }
          Compress-Archive -Path "$($releaseDir.FullName)/*" -DestinationPath "../LudusLatinus-Windows-Flutter.zip" -Force

      - name: Publier l'archive Windows en Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LudusLatinus-Windows-Flutter
          path: LudusLatinus-Windows-Flutter.zip