name: Tests

# Valide le projet à chaque push et chaque pull request :
#   - les 132 solutions du curriculum passent bien leurs propres tests ;
#   - la logique de progression, de motivation et de traduction est saine ;
#   - le style du code reste homogène (ruff).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Sans cette limite, un test qui se bloque tourne jusqu'au plafond de
    # GitHub (6 heures) avant d'être tué, et l'échec ressemble à une simple
    # annulation. La suite dure quelques secondes : 15 minutes sont larges.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Sur Linux, tkinter est un paquet séparé.
      - name: Installer Tk & Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Installer dépendances
        run: python -m pip install --upgrade pip Pillow

      - name: Lancer les tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi
        shell: bash

      - name: Contrôler que l'installation est complète
        run: python main.py --check

  style:
    name: Style (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer ruff
        run: python -m pip install --upgrade pip ruff

      - name: Vérifier le style
        run: ruff check .
