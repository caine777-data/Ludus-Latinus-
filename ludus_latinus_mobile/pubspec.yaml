name: ludus_latinus_mobile
description: "Ludus Latinus — L'épopée de la langue latine pour le Collège et les passionnés de Rome."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/ludus_latinus_dataset.json
    - assets/images/
    - assets/images/lupulus/
    - assets/images/circus/
    - assets/audio/
    - assets/animations/