name: ludus_latinus_mobile
description: "Ludus Latinus — L'épopée de la langue latine pour le Collège et les passionnés de Rome."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6
  lottie: ^3.1.2
  ffi: ^2.1.2
  path_provider: ^2.1.2
  video_player: ^2.14.0
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.2
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/data/ludus_latinus_dataset.json
    - assets/images/
    - assets/images/lupulus/
    - assets/images/circus/
    - assets/images/boutique/
    - assets/images/avatars/
    - assets/images/mondes/
    - assets/images/pantheon/
    - assets/data/pantheon.json
    - assets/images/via/
    - assets/images/duel/
    - assets/images/paires/
    - assets/images/taverne/
    - assets/images/mot_du_jour/
    - assets/images/cesar/
    - assets/images/marche/
    - assets/images/cas/
    - assets/images/epigraphie/
    - assets/images/studio/
    - assets/images/lecons/
    - assets/images/album/
    - assets/audio/
    - assets/animations/
    - assets/images/animated/
    - assets/cinematics/
    - assets/fonts/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-VariableFont_wght.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
    # Mode lecture confort : police dessinée pour distinguer les lettres
    # proches (b/d, I/l/1). Licence OFL : assets/fonts/OFL_AtkinsonHyperlegible.txt
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
